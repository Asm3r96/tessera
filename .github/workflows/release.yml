name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Logic checks
        run: swift run TesseraChecks

      # Every release is signed with the same certificate, so macOS keeps
      # the Accessibility permission when a user updates.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.TESSERA_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.TESSERA_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/identity.p12"

      - name: Build
        env:
          TESSERA_IDENTITY: Tessera Release Signing
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/app/Tessera.zip --title "Tessera $GITHUB_REF_NAME" --generate-notes
