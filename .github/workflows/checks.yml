name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Logic checks
        run: swift run TesseraChecks
      - name: Focus checks
        run: bash scripts/check-focus.sh
